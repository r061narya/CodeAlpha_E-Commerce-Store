<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MiniSocial - Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- Register Page -->

    <main class="auth-page">

        <section class="auth-card">


            <!-- Logo -->

            <div class="auth-logo">
                MiniSocial
            </div>


            <!-- Heading -->

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join your MiniSocial community
            </p>


            <!-- Register Form -->

            <form id="registerForm">


                <!-- Username -->

                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="30"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- Login Link -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </section>
    <script src="js/auth.js"></script>
    <!-- <script src="js/feed.js"></script> -->
  

    </main>

</body>

</html>
