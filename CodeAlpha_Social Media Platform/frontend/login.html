<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MiniSocial - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- Login Page -->

    <main class="auth-page">

        <section class="auth-card">

            <!-- Logo -->

            <div class="auth-logo">
                MiniSocial
            </div>


            <!-- Heading -->

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to your MiniSocial account
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

            </form>


            <!-- Register Link -->

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

                <script src="js/auth.js"></script>
                <!-- <script src="js/feed.js"></script> -->
        </section>

    </main>
</body>

</html>
