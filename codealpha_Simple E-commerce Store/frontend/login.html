<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEase</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
        </nav>

    </header>


    <!-- Login -->

    <main class="auth-page">

        <div class="auth-box">

            <h1>Login</h1>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p>
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
